[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-babysitter"
version = "0.1.0"
description = "A TUI that babysits BerriAI/litellm PRs until they're green."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
]

[project.scripts]
pr-babysitter = "pr_babysitter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
